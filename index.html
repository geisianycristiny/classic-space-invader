<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="src/assets/images/player.png" type="image/x-icon">
    <title>Classic Space Invaders | geisiany</title>
    <style>
        canvas{
            box-shadow: rgb(152, 98, 98) 20px 10px 50px;
        }
        h1{
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-family: "Press Start 2P";
            color: rgb(68, 49, 49);
        }
        body{
            display: flex;
            align-items: center;
            flex-direction: column;
            margin: 0px;
            padding: 0px;
            height: 100vh;
            background: linear-gradient(
                0deg,
                rgba(114, 60, 60, 0.804) 0%,
                rgb(169, 116, 116) 100%
            );
        }
        #logosContainer{
            display: flex;
            margin-top: 30px;
        }
        #instructions {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100vh;
        }
        #instructions span {
            color:rgb(68, 49, 49)
        }
    </style>
</head>
<body>
     <div id="logosContainer">
        <div id="logoSenac">
            <img src="src/assets/images/logo-senac.png" alt="logo Senac" width="310px"
           height="110px">
          </div>
          <div id="logoSesc">
            <img src="src/assets/images/logo-sesc.png" alt="logo Sesc" width="310px"
        height="150px">
    </div>  
        </div>
        <div id="instructions">
            <h1>Bem-vindo ao jogo <span>Space Invaders!</span></h1>
            <p>Use as setas esquerda e direita para mover.</p>
            <p>Pressione a barra de espaço para atirar.</p>
            <button id="playButton" class="button">jogar</button></button>
        </div>
    </did id="gammeOverScreen">
    <h1>game Over</h1>
    <p id="gammeOverScreenScore"></p>
    <button id="retryButton" class="button">tentar novamente</button>
    </body><div>
    </div id="winScreen">
    <h1>parabens, voce venceu!</h1>
    <p id="winScreemScore"></p>
    <button id="restartButton" classe="button">reiniciar</button>
    </div>
    <div id="titleAndScore">
        <h1 id="title">Space Invaders</h1>
        <p id="score">pontuaçao: 0</p>  

    </div>

    <canvas id="game"></canvas>
    <script type="module" src="src/javascript/index.js"></script>
</body>
</html>
